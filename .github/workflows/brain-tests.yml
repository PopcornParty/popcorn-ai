name: Popcorn Brain Tests
on:
  pull_request:
    paths: ["brain/**", ".github/workflows/brain-tests.yml", ".github/workflows/popcorn-brain-cloud-training.yml"]
  push:
    branches: [main]
    paths: ["brain/**", ".github/workflows/brain-tests.yml", ".github/workflows/popcorn-brain-cloud-training.yml"]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install --upgrade pip
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run unit tests
        working-directory: brain
        run: python -m unittest discover -s tests -v
      - name: Validate starter dataset
        run: python brain/validate_dataset.py --data brain/data/starter.jsonl
      - name: Run short CPU training smoke test
        run: python brain/train.py --data brain/data/starter.jsonl --out /tmp/popcorn-smoke --max-iters 2 --batch-size 2 --block-size 16 --eval-interval 1 --device cpu
      - name: Run multi-category evaluation smoke test
        run: python brain/eval_suite.py --checkpoint /tmp/popcorn-smoke/latest.pt --output /tmp/popcorn-smoke/evaluation-report.json --max-new-tokens 12
      - name: Verify checkpoints and evaluation report
        run: test -s /tmp/popcorn-smoke/latest.pt && test -s /tmp/popcorn-smoke/best.pt && test -s /tmp/popcorn-smoke/evaluation-report.json
