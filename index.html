<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101010"><title>Popcorn AI</title>
<style>
:root{color-scheme:dark;--bg:#212121;--panel:#171717;--panel2:#2b2b2b;--text:#ececec;--muted:#a1a1a1;--accent:#e4572e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;height:100dvh;overflow:hidden}button,textarea{font:inherit}button{cursor:pointer;color:inherit;border:0}.app{height:100%;display:flex}.sidebar{width:260px;background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:10px;flex-shrink:0}.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:18px;padding:9px}.logo{width:30px;height:30px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:white;font-weight:900}.newchat,.history button,.sidebar-bottom button{background:transparent;text-align:left;padding:10px 12px;border-radius:10px;width:100%;color:#ddd}.newchat{border:1px solid #3c3c3c}.history{overflow:auto;flex:1}.history button{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history button.active,.history button:hover,.sidebar-bottom button:hover,.newchat:hover{background:var(--panel2)}.sidebar-bottom{border-top:1px solid #333;padding-top:8px;color:var(--muted);font-size:12px}.main{min-width:0;flex:1;display:flex;flex-direction:column;position:relative}.topbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #303030}.topbar strong{font-weight:600}.menu{display:none;background:transparent;font-size:22px}.chat{flex:1;overflow-y:auto;padding:28px 18px 18px}.welcome{max-width:760px;margin:12vh auto 0;text-align:center}.welcome h1{font-size:clamp(26px,4vw,36px);font-weight:600;margin:0 0 24px}.prompts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:30px}.prompt{border:1px solid #424242;background:transparent;text-align:left;padding:14px;border-radius:14px;color:#ddd}.prompt:hover{background:#2a2a2a}.messages{max-width:780px;margin:auto;display:flex;flex-direction:column;gap:24px}.message{display:flex;gap:12px;align-items:flex-start}.avatar{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;font-weight:700}.avatar.user{background:#3d3d3d}.avatar.ai{background:var(--accent)}.content{min-width:0;flex:1;white-space:pre-wrap;overflow-wrap:anywhere;padding-top:2px}.content code{background:#343434;padding:2px 5px;border-radius:5px}.content pre{white-space:pre-wrap;background:#151515;border:1px solid #333;padding:12px;border-radius:10px;overflow:auto}.content a{color:#9bc7ff}.composer-wrap{padding:10px 18px 14px}.composer{max-width:780px;margin:auto;background:#303030;border:1px solid #444;border-radius:24px;padding:10px 10px 10px 16px;display:flex;gap:10px;align-items:flex-end}.composer textarea{resize:none;outline:0;border:0;background:transparent;color:var(--text);flex:1;max-height:180px;min-height:28px;padding:4px 0}.send{width:36px;height:36px;border-radius:50%;background:#f0f0f0;color:#171717;font-size:19px;font-weight:bold}.send:disabled{opacity:.4;cursor:not-allowed}.disclaimer{text-align:center;color:#858585;font-size:11px;padding:7px 0 0}.error{color:#ff9c91;background:#382522;padding:10px;border-radius:10px}.typing{color:var(--muted)}@media(max-width:700px){.sidebar{position:absolute;z-index:5;inset:0 auto 0 0;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 30px #0008}.sidebar.open{transform:translateX(0)}.menu{display:block}.prompts{grid-template-columns:1fr}.welcome{margin-top:8vh}.chat{padding:20px 12px}.composer-wrap{padding:8px 10px 10px}.topbar{padding:0 12px}}
</style></head><body><div class="app">
<aside class="sidebar" id="sidebar"><div class="brand"><div class="logo">P</div>Popcorn AI</div><button class="newchat" id="newChat">＋ New chat</button><div class="history" id="history"></div><div class="sidebar-bottom"><button id="clearChats">♲ Clear all chats</button><div style="padding:8px 12px">Popcorn AI · Uses a free AI model with provider limits</div></div></aside>
<main class="main"><header class="topbar"><button class="menu" id="menu">☰</button><strong>Popcorn AI <span style="color:var(--muted);font-weight:400">· Free model</span></strong><button id="newTop" style="background:transparent" title="New chat">＋</button></header><section class="chat" id="chat"><div class="welcome" id="welcome"><h1>What can I help with?</h1><div class="prompts"><button class="prompt" data-prompt="Explain something complicated in simple terms">Explain something complicated</button><button class="prompt" data-prompt="Help me brainstorm a useful project idea">Brainstorm project ideas</button><button class="prompt" data-prompt="Write a small piece of code and explain it">Write and explain code</button><button class="prompt" data-prompt="Help me make a plan for something I want to achieve">Make a plan</button></div></div><div class="messages" id="messages"></div></section><div class="composer-wrap"><form class="composer" id="form"><textarea id="input" rows="1" placeholder="Message Popcorn AI…" aria-label="Message Popcorn AI"></textarea><button class="send" id="send" type="submit" aria-label="Send">↑</button></form><div class="disclaimer">AI can make mistakes. Avoid sharing private or sensitive information.</div></div></main></div>
<script>
const $=s=>document.querySelector(s);let chats=JSON.parse(localStorage.getItem('popcorn_chats')||'[]');let current=null,busy=false;
function persist(){localStorage.setItem('popcorn_chats',JSON.stringify(chats))}function active(){return chats.find(c=>c.id===current)}
function newChat(){current=crypto.randomUUID();chats.unshift({id:current,title:'New chat',messages:[]});persist();render();$('#sidebar').classList.remove('open');$('#input').focus()}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function format(s){let out=escapeHtml(s);out=out.replace(/```([\s\S]*?)```/g,(_,c)=>'<pre><code>'+c.trim()+'</code></pre>');out=out.replace(/`([^`]+)`/g,'<code>$1</code>');out=out.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');out=out.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a target="_blank" rel="noopener noreferrer" href="$2">$1</a>');return out}
function render(){if(!current||!active())current=chats[0]?.id||null;$('#history').innerHTML=chats.map(c=>`<button class="${c.id===current?'active':''}" data-id="${c.id}">${escapeHtml(c.title)}</button>`).join('');$('#welcome').style.display=active()?.messages.length?'none':'block';$('#messages').innerHTML=(active()?.messages||[]).map(m=>`<div class="message"><div class="avatar ${m.role==='user'?'user':'ai'}">${m.role==='user'?'Y':'P'}</div><div class="content">${format(m.content)}</div></div>`).join('');$('#chat').scrollTop=$('#chat').scrollHeight;$('#send').disabled=busy;$('#input').disabled=busy}
$('#history').addEventListener('click',e=>{let b=e.target.closest('button[data-id]');if(b){current=b.dataset.id;render()}});$('#newChat').onclick=newChat;$('#newTop').onclick=newChat;$('#menu').onclick=()=>$('#sidebar').classList.toggle('open');$('#clearChats').onclick=()=>{if(confirm('Delete all saved conversations?')){chats=[];current=null;persist();newChat()}};
document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{ $('#input').value=b.dataset.prompt;sendMessage() });
const input=$('#input');input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,180)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});$('#form').addEventListener('submit',e=>{e.preventDefault();sendMessage()});
async function sendMessage(){let text=input.value.trim();if(!text||busy)return;if(!active())newChat();let c=active();c.messages.push({role:'user',content:text});if(c.title==='New chat')c.title=text.slice(0,42)+(text.length>42?'…':'');input.value='';input.style.height='auto';busy=true;persist();render();try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:c.messages.map(m=>({role:m.role,content:m.content}))})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Request failed');c.messages.push({role:'assistant',content:data.reply});}catch(err){c.messages.push({role:'assistant',content:'⚠️ '+err.message+'\n\nIf this is a newly deployed app, make sure the server API key is configured.'});}finally{busy=false;persist();render()}}
if(!chats.length)newChat();else{current=chats[0].id;render()}
</script></body></html>
